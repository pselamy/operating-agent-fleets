<svg id="system-context-light" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 1296px; background-color: transparent;" viewBox="0 0 1296 297" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-system-context-light" aria-labelledby="chart-title-system-context-light"><title id="chart-title-system-context-light">Operating agent system context</title><desc id="chart-desc-system-context-light">An operator gives intent, judgment, authentication, and consequential approval to one operating agent system. The system turns bounded work into evidence-backed outcomes and operational observations into reviewed constraints. It sends scoped requests to external systems of record and action and returns evidence, exceptions, and outcomes to the operator. Source, delivery, durable knowledge, agent, worker, queue, policy, credential, and verification components are internal and deliberately deferred to the container view.</desc><style>#system-context-light{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#system-context-light .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#system-context-light .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#system-context-light .error-icon{fill:#552222;}#system-context-light .error-text{fill:#552222;stroke:#552222;}#system-context-light .edge-thickness-normal{stroke-width:1px;}#system-context-light .edge-thickness-thick{stroke-width:3.5px;}#system-context-light .edge-pattern-solid{stroke-dasharray:0;}#system-context-light .edge-thickness-invisible{stroke-width:0;fill:none;}#system-context-light .edge-pattern-dashed{stroke-dasharray:3;}#system-context-light .edge-pattern-dotted{stroke-dasharray:2;}#system-context-light .marker{fill:#666;stroke:#666;}#system-context-light .marker.cross{stroke:#666;}#system-context-light svg{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:16px;}#system-context-light p{margin:0;}#system-context-light .label{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#000000;}#system-context-light .cluster-label text{fill:#333;}#system-context-light .cluster-label span{color:#333;}#system-context-light .cluster-label span p{background-color:transparent;}#system-context-light .label text,#system-context-light span{fill:#000000;color:#000000;}#system-context-light .node rect,#system-context-light .node circle,#system-context-light .node ellipse,#system-context-light .node polygon,#system-context-light .node path{fill:#eee;stroke:#999;stroke-width:1px;}#system-context-light .rough-node .label text,#system-context-light .node .label text,#system-context-light .image-shape .label,#system-context-light .icon-shape .label{text-anchor:middle;}#system-context-light .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#system-context-light .rough-node .label,#system-context-light .node .label,#system-context-light .image-shape .label,#system-context-light .icon-shape .label{text-align:center;}#system-context-light .node.clickable{cursor:pointer;}#system-context-light .root .anchor path{fill:#666!important;stroke-width:0;stroke:#666;}#system-context-light .arrowheadPath{fill:#333333;}#system-context-light .edgePath .path{stroke:#666;stroke-width:1px;}#system-context-light .flowchart-link{stroke:#666;fill:none;}#system-context-light .edgeLabel{background-color:white;text-align:center;}#system-context-light .edgeLabel p{background-color:white;}#system-context-light .edgeLabel rect{opacity:0.5;background-color:white;fill:white;}#system-context-light .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#system-context-light .cluster rect{fill:hsl(0, 0%, 98.921